<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Report</title>
    <meta name="dl-version" content="0.2.7">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="last-updated" content="01-01-2024 12:00:00">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Checklist",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "checklist",
                            "elementType": "visual",
                            "id": "elem-3",
                            "datasetId": "tasks",
                            "statusColumn": "Completed",
                            "warningColumn": "Due",
                            "warningThreshold": 5,
                            "columns": [
                                "Task",
                                "Due"
                            ]
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "tasks": {
            "id": "tasks",
            "format": "records",
            "columns": [
                "Task",
                "Completed",
                "Due"
            ],
            "dtypes": [
                "string",
                "boolean",
                "date"
            ],
            "data": [
                {
                    "Task": "Task A",
                    "Completed": true,
                    "Due": "2024-01-01T00:00:00.000000Z"
                },
                {
                    "Task": "Task B",
                    "Completed": false,
                    "Due": "2024-02-01T00:00:00.000000Z"
                },
                {
                    "Task": "Task C",
                    "Completed": false,
                    "Due": "2024-01-15T00:00:00.000000Z"
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
