<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulas Report</title>
    <meta name="dl-version" content="0.4.1">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="last-updated" content="01-01-2024 12:00:00">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Formulas",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "table",
                            "elementType": "visual",
                            "id": "elem-3",
                            "datasetId": "sales",
                            "title": "Big Sales",
                            "filter": {
                                "column": "Amount",
                                "op": "gt",
                                "value": 100
                            },
                            "columns": [
                                "Region",
                                "Amount"
                            ]
                        },
                        {
                            "type": "kpi",
                            "elementType": "visual",
                            "id": "elem-4",
                            "datasetId": "sales",
                            "filter": {
                                "and": [
                                    {
                                        "column": "Amount",
                                        "op": "gt",
                                        "value": 100
                                    },
                                    {
                                        "column": "Region",
                                        "op": "neq",
                                        "value": "West"
                                    }
                                ]
                            },
                            "valueColumn": "Amount",
                            "title": "First Big Sale",
                            "rowIndex": 0
                        }
                    ]
                },
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "clusteredBar",
                            "elementType": "visual",
                            "id": "elem-6",
                            "datasetId": "big_sales",
                            "xColumn": "Region",
                            "yColumns": [
                                "Total"
                            ]
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "sales": {
            "id": "sales",
            "format": "records",
            "columns": [
                "Region",
                "Units",
                "Amount"
            ],
            "dtypes": [
                "string",
                "number",
                "number"
            ],
            "data": [
                {
                    "Region": "North",
                    "Units": 10,
                    "Amount": 100.0
                },
                {
                    "Region": "South",
                    "Units": 20,
                    "Amount": 250.0
                },
                {
                    "Region": "East",
                    "Units": 30,
                    "Amount": 300.0
                },
                {
                    "Region": "West",
                    "Units": 5,
                    "Amount": 80.0
                }
            ]
        },
        "big_sales": {
            "id": "big_sales",
            "source": "sales",
            "filter": {
                "column": "Amount",
                "op": "gt",
                "value": 100
            },
            "aggregate": {
                "groupBy": [
                    "Region"
                ],
                "aggregates": [
                    {
                        "column": "Amount",
                        "fn": "sum",
                        "as": "Total"
                    }
                ]
            }
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
