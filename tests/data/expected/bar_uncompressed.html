<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Report</title>
    <meta name="dl-version" content="0.2.10">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="last-updated" content="01-01-2024 12:00:00">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Bar",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "clusteredBar",
                            "elementType": "visual",
                            "id": "elem-3",
                            "datasetId": "finance",
                            "title": "Clustered",
                            "xColumn": "Month",
                            "yColumns": [
                                "Sales",
                                "Cost"
                            ]
                        },
                        {
                            "type": "stackedBar",
                            "elementType": "visual",
                            "id": "elem-4",
                            "datasetId": "finance",
                            "title": "Stacked",
                            "xColumn": "Month",
                            "yColumns": [
                                "Sales",
                                "Cost"
                            ]
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "finance": {
            "id": "finance",
            "format": "records",
            "columns": [
                "Month",
                "Sales",
                "Cost"
            ],
            "dtypes": [
                "string",
                "number",
                "number"
            ],
            "data": [
                {
                    "Month": "Jan",
                    "Sales": 100,
                    "Cost": 80
                },
                {
                    "Month": "Feb",
                    "Sales": 150,
                    "Cost": 100
                },
                {
                    "Month": "Mar",
                    "Sales": 200,
                    "Cost": 120
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
