<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pie Report</title>
    <meta name="dl-version" content="0.2.7">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="last-updated" content="01-01-2024 12:00:00">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Pie",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "pie",
                            "elementType": "visual",
                            "id": "elem-3",
                            "datasetId": "traffic",
                            "title": "Traffic Source",
                            "categoryColumn": "Segment",
                            "valueColumn": "Visits"
                        },
                        {
                            "type": "pie",
                            "elementType": "visual",
                            "id": "elem-4",
                            "datasetId": "traffic",
                            "title": "Donut",
                            "categoryColumn": "Segment",
                            "valueColumn": "Visits",
                            "innerRadius": 50
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "traffic": {
            "id": "traffic",
            "format": "records",
            "columns": [
                "Segment",
                "Visits"
            ],
            "dtypes": [
                "string",
                "number"
            ],
            "data": [
                {
                    "Segment": "Direct",
                    "Visits": 500
                },
                {
                    "Segment": "Social",
                    "Visits": 300
                },
                {
                    "Segment": "Organic",
                    "Visits": 200
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
