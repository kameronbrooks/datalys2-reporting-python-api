<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Layout</title>
    <meta name="dl-version" content="0.5.0">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="last-updated" content="01-01-2024 12:00:00">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Main",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "text",
                            "elementType": "visual",
                            "id": "elem-3",
                            "title": "Left"
                        },
                        {
                            "type": "text",
                            "elementType": "visual",
                            "id": "elem-4",
                            "title": "Right"
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "data": {
            "id": "data",
            "format": "records",
            "columns": [
                "A",
                "B"
            ],
            "dtypes": [
                "number",
                "number"
            ],
            "data": [
                {
                    "A": 1,
                    "B": 2
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
