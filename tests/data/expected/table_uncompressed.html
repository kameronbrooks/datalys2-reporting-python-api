<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Report</title>
    <meta name="dl-version" content="0.5.0">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="last-updated" content="01-01-2024 12:00:00">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Table",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "table",
                            "elementType": "visual",
                            "id": "elem-3",
                            "datasetId": "users",
                            "sortColumn": "Age",
                            "columns": [
                                "Name",
                                "City"
                            ],
                            "pageSize": 5
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "users": {
            "id": "users",
            "format": "records",
            "columns": [
                "Name",
                "Age",
                "City"
            ],
            "dtypes": [
                "string",
                "number",
                "string"
            ],
            "data": [
                {
                    "Name": "Alice",
                    "Age": 25,
                    "City": "NY"
                },
                {
                    "Name": "Bob",
                    "Age": 30,
                    "City": "LA"
                },
                {
                    "Name": "Charlie",
                    "Age": 35,
                    "City": "SF"
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
