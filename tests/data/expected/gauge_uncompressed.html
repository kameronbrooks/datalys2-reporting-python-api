<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gauge Report</title>
    <meta name="dl-version" content="0.2.10">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="last-updated" content="01-01-2024 12:00:00">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Gauge",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "gauge",
                            "elementType": "visual",
                            "id": "elem-3",
                            "datasetId": "sensors",
                            "valueMin": 0,
                            "valueMax": 120,
                            "valueColumn": "Value",
                            "title": "Speedometer"
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "sensors": {
            "id": "sensors",
            "format": "records",
            "columns": [
                "Metric",
                "Value",
                "Min",
                "Max"
            ],
            "dtypes": [
                "string",
                "number",
                "number",
                "number"
            ],
            "data": [
                {
                    "Metric": "Speed",
                    "Value": 80,
                    "Min": 0,
                    "Max": 120
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
