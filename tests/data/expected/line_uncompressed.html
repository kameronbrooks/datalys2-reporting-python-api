<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line Report</title>
    <meta name="dl-version" content="0.2.8">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="last-updated" content="01-01-2024 12:00:00">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Line",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "line",
                            "elementType": "visual",
                            "id": "elem-3",
                            "datasetId": "weather",
                            "xColumn": "Day",
                            "yColumns": [
                                "Temperature",
                                "Humidity"
                            ],
                            "smooth": true
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "weather": {
            "id": "weather",
            "format": "records",
            "columns": [
                "Day",
                "Temperature",
                "Humidity"
            ],
            "dtypes": [
                "number",
                "number",
                "number"
            ],
            "data": [
                {
                    "Day": 1,
                    "Temperature": 20,
                    "Humidity": 40
                },
                {
                    "Day": 2,
                    "Temperature": 22,
                    "Humidity": 45
                },
                {
                    "Day": 3,
                    "Temperature": 21,
                    "Humidity": 42
                },
                {
                    "Day": 4,
                    "Temperature": 24,
                    "Humidity": 38
                },
                {
                    "Day": 5,
                    "Temperature": 25,
                    "Humidity": 35
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
