<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Export Report</title>
    <meta name="dl-version" content="0.5.0">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="last-updated" content="01-01-2024 12:00:00">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Charts",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "line",
                            "elementType": "visual",
                            "id": "elem-3",
                            "datasetId": "finance",
                            "xColumn": "Month",
                            "yColumns": [
                                "Revenue",
                                "Cost"
                            ],
                            "exportFileName": "revenue-trend"
                        },
                        {
                            "type": "clusteredBar",
                            "elementType": "visual",
                            "id": "elem-4",
                            "datasetId": "finance",
                            "xColumn": "Month",
                            "yColumns": [
                                "Revenue"
                            ],
                            "enableExport": false
                        }
                    ]
                },
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "pie",
                            "elementType": "visual",
                            "id": "elem-6",
                            "datasetId": "finance",
                            "categoryColumn": "Month",
                            "valueColumn": "Revenue",
                            "exportFileName": "revenue-share",
                            "contextMenu": false
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "finance": {
            "id": "finance",
            "format": "records",
            "columns": [
                "Month",
                "Revenue",
                "Cost"
            ],
            "dtypes": [
                "string",
                "number",
                "number"
            ],
            "data": [
                {
                    "Month": "Jan",
                    "Revenue": 120.0,
                    "Cost": 80.0
                },
                {
                    "Month": "Feb",
                    "Revenue": 150.0,
                    "Cost": 95.0
                },
                {
                    "Month": "Mar",
                    "Revenue": 90.0,
                    "Cost": 60.0
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
