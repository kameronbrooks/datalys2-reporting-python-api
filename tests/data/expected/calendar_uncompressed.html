<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Report</title>
    <meta name="dl-version" content="0.5.0">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="last-updated" content="01-01-2024 12:00:00">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Calendar",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "calendar",
                            "elementType": "visual",
                            "id": "team-calendar",
                            "datasetId": "events",
                            "startColumn": "Start",
                            "endColumn": "End",
                            "titleColumn": "Task",
                            "categoryColumn": "Team",
                            "defaultView": "month",
                            "defaultDate": "2026-03-01",
                            "weekStartsOn": 1,
                            "dayStartHour": 8,
                            "dayEndHour": 18,
                            "maxEventsPerDay": 2,
                            "timeFormat": "24h",
                            "legendTitle": "Teams",
                            "rowModal": true,
                            "rowModalTitle": "Event details"
                        }
                    ]
                },
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "calendar",
                            "elementType": "visual",
                            "id": "elem-5",
                            "datasetId": "holidays",
                            "dateColumn": "Day",
                            "titleColumn": "Holiday",
                            "defaultDate": "2026-03-01",
                            "showWeekends": false
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "events": {
            "id": "events",
            "format": "records",
            "columns": [
                "Start",
                "End",
                "Task",
                "Team"
            ],
            "dtypes": [
                "datetime",
                "datetime",
                "string",
                "string"
            ],
            "data": [
                {
                    "Start": "2026-03-02T09:00:00.000000Z",
                    "End": "2026-03-02T10:00:00.000000Z",
                    "Task": "Standup",
                    "Team": "Eng"
                },
                {
                    "Start": "2026-03-03T13:30:00.000000Z",
                    "End": "2026-03-05T14:00:00.000000Z",
                    "Task": "Offsite",
                    "Team": "Sales"
                },
                {
                    "Start": "2026-03-09T00:00:00.000000Z",
                    "End": "2026-03-11T00:00:00.000000Z",
                    "Task": "Sprint review",
                    "Team": "Eng"
                }
            ]
        },
        "holidays": {
            "id": "holidays",
            "format": "records",
            "columns": [
                "Day",
                "Holiday"
            ],
            "dtypes": [
                "date",
                "string"
            ],
            "data": [
                {
                    "Day": "2026-03-04T00:00:00.000000Z",
                    "Holiday": "Founders Day"
                },
                {
                    "Day": "2026-03-18T00:00:00.000000Z",
                    "Holiday": "Release Day"
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
