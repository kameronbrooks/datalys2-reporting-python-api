<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heatmap Report</title>
    <meta name="dl-version" content="0.2.8">
    <meta name="description" content="">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Heatmap",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "heatmap",
                            "elementType": "visual",
                            "id": "elem-3",
                            "datasetId": "matrix",
                            "xColumn": "X",
                            "yColumn": "Y",
                            "valueColumn": "Val"
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "matrix": {
            "id": "matrix",
            "format": "records",
            "columns": [
                "X",
                "Y",
                "Val"
            ],
            "dtypes": [
                "string",
                "string",
                "number"
            ],
            "data": [
                {
                    "X": "A",
                    "Y": "1",
                    "Val": 10
                },
                {
                    "X": "A",
                    "Y": "2",
                    "Val": 20
                },
                {
                    "X": "B",
                    "Y": "1",
                    "Val": 30
                },
                {
                    "X": "B",
                    "Y": "2",
                    "Val": 40
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
