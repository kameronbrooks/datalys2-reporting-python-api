<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gauge Showcase</title>
    <meta name="dl-version" content="0.5.0">
    <meta name="description" content="Simple gauges and range-banded gauges.">
    <meta name="author" content="">
    <meta name="last-updated" content="08-02-2026 15:10:45">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/dl2-style.css">
</head>
<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Gauges",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "gauge",
                            "elementType": "visual",
                            "id": "elem-106",
                            "datasetId": "metrics",
                            "valueColumn": "CSAT",
                            "minValue": 0,
                            "maxValue": 100,
                            "title": "Customer Satisfaction",
                            "unit": "%"
                        },
                        {
                            "type": "gauge",
                            "elementType": "visual",
                            "id": "elem-107",
                            "datasetId": "metrics",
                            "valueColumn": "CSAT",
                            "minValue": 0,
                            "maxValue": 100,
                            "title": "CSAT vs targets",
                            "ranges": [
                                {
                                    "from": 0,
                                    "to": 50,
                                    "color": "#ef4444",
                                    "label": "Poor"
                                },
                                {
                                    "from": 50,
                                    "to": 75,
                                    "color": "#f59e0b",
                                    "label": "Average"
                                },
                                {
                                    "from": 75,
                                    "to": 90,
                                    "color": "#22c55e",
                                    "label": "Good"
                                },
                                {
                                    "from": 90,
                                    "to": 100,
                                    "color": "#15803d",
                                    "label": "Excellent",
                                    "showPlus": true
                                }
                            ],
                            "unit": "%",
                            "showLegend": true
                        }
                    ]
                },
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "gauge",
                            "elementType": "visual",
                            "id": "elem-109",
                            "datasetId": "metrics",
                            "valueColumn": "CPULoad",
                            "minValue": 0,
                            "maxValue": 1,
                            "title": "CPU Load",
                            "format": "percent",
                            "roundingPrecision": 0
                        },
                        {
                            "type": "gauge",
                            "elementType": "visual",
                            "id": "elem-110",
                            "datasetId": "metrics",
                            "valueColumn": "Pipeline",
                            "minValue": 0,
                            "maxValue": 2000000,
                            "title": "Pipeline Value",
                            "format": "currency",
                            "roundingPrecision": 0
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "metrics": {
            "id": "metrics",
            "format": "records",
            "columns": [
                "CSAT",
                "CPULoad",
                "Pipeline"
            ],
            "dtypes": [
                "number",
                "number",
                "number"
            ],
            "data": [
                {
                    "CSAT": 83.5,
                    "CPULoad": 0.62,
                    "Pipeline": 1240000
                }
            ]
        }
    }
}</script>
    <script src="https://cdn.jsdelivr.net/gh/kameronbrooks/datalys2-reporting@latest/dist/datalys2-reports.min.js"></script>
</body>
</html>
