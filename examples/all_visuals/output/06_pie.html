<!DOCTYPE html>

<head>

<body>

    <div id="root"></div>
    <script id="report-data" type="application/json">{
    "pages": [
        {
            "title": "Pie",
            "rows": [
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "pie",
                            "elementType": "visual",
                            "id": "elem-55",
                            "datasetId": "share",
                            "categoryColumn": "Browser",
                            "valueColumn": "Users",
                            "showLegend": true
                        },
                        {
                            "type": "pie",
                            "elementType": "visual",
                            "id": "elem-56",
                            "datasetId": "share",
                            "categoryColumn": "Browser",
                            "valueColumn": "Users",
                            "innerRadius": 70,
                            "showLegend": true
                        }
                    ]
                },
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "pie",
                            "elementType": "visual",
                            "id": "elem-58",
                            "datasetId": "orders",
                            "aggregate": {
                                "groupBy": [
                                    "Region"
                                ],
                                "aggregates": [
                                    {
                                        "column": "Amount",
                                        "fn": "sum",
                                        "as": "Total"
                                    }
                                ]
                            },
                            "categoryColumn": "Region",
                            "valueColumn": "Total",
                            "showLegend": true
                        },
                        {
                            "type": "pie",
                            "elementType": "visual",
                            "id": "elem-59",
                            "datasetId": "orders",
                            "aggregate": {
                                "groupBy": [
                                    "Region"
                                ],
                                "aggregates": [
                                    {
                                        "column": "Region",
                                        "fn": "count",
                                        "as": "Orders"
                                    }
                                ]
                            },
                            "categoryColumn": "Region",
                            "valueColumn": "Orders",
                            "innerRadius": 70,
                            "showLegend": true
                        },
                        {
                            "type": "pie",
                            "elementType": "visual",
                            "id": "elem-60",
                            "datasetId": "orders",
                            "filter": {
                                "column": "Amount",
                                "op": "gte",
                                "value": 100
                            },
                            "aggregate": {
                                "groupBy": [
                                    "Region"
                                ],
                                "aggregates": [
                                    {
                                        "column": "Amount",
                                        "fn": "sum",
                                        "as": "Total"
                                    }
                                ]
                            },
                            "categoryColumn": "Region",
                            "valueColumn": "Total",
                            "showLegend": true
                        }
                    ]
                }
            ]
        }
    ],
    "datasets": {
        "share": {
            "id": "share",
            "format": "records",
            "columns": [
                "Browser",
                "Users"
            ],
            "dtypes": [
                "string",
                "number"
            ],
            "data": [
                {
                    "Browser": "Chrome",

                },
                {

        "orders": {

}</script>
