<!DOCTYPE html>

                                                    "Revenue"

                                                "type": "card",

                                        ]
                                    }
                                }

                            "title": "Breakdown"
                        }
                    ]
                },
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [

                                    "title": "Details",
                                    "layout": {
                                        "type": "layout",
                                        "direction": "column",

                                                    {

                                                            "direction": "column",

                                                                {
                                                                    "type": "line",
                                                                    "elementType": "visual",
                                                                    "id": "elem-22",
                                                                    "datasetId": "sales",
                                                                    "xColumn": "Month",
                                                                    "yColumns": [
                                                                        "Units"

                                                                }
                                                            ]
                                                        }
                                                    },
                                                    {
                                                        "title": "Revenue",
                                                        "layout": {
                                                            "type": "layout",
                                                            "direction": "column",
                                                            "children": [
                                                                {
                                                                    "type": "line",
                                                                    "elementType": "visual",
                                                                    "id": "elem-24",
                                                                    "datasetId": "sales",
                                                                    "xColumn": "Month",
                                                                    "yColumns": [
                                                                        "Revenue"
                                                                    ]
                                                                }
                                                            ]
                                                        }
                                                    }
                                                ]
                                            }
                                        ]
                                    }
                                }
                            ],

                        }
                    ]
                },
                {
                    "type": "layout",
                    "direction": "row",
                    "children": [
                        {
                            "type": "link",

                            "targetId": "sales-table",
                            "label": "Jump to the data table",
                            "linkStyle": "button"
                        }
                    ]
                }
            ],

        }
